<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHA Memory Graph</title>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/sql-wasm.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',monospace;background:#0d0d0d;color:#c0c0c0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#1a1a1a;border-bottom:1px solid #333;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
h1{font-size:16px;font-weight:600;color:#e0e0e0;letter-spacing:.5px}
h1 span{color:#888;font-weight:400}
.file-area{display:flex;align-items:center;gap:10px;margin-left:auto}
.file-label{background:#2a2a2a;border:1px solid #444;color:#ccc;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px}
.file-label:hover{background:#333;border-color:#666}
#status{font-size:12px;padding:8px 20px;background:#111;border-bottom:1px solid #222;color:#888;flex-shrink:0}
#status.error{color:#e55}#status.ok{color:#5d8}#status.loading{color:#8bf}
#stats{background:#151515;border-bottom:1px solid #2a2a2a;padding:8px 20px;display:none;gap:24px;font-size:12px;color:#999;flex-shrink:0;flex-wrap:wrap}
.stat{display:flex;gap:4px}.stat span:first-child{color:#666}.stat span:last-child{color:#e0e0e0;font-weight:500}
.toolbar{background:#111;border-bottom:1px solid #2a2a2a;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.toolbar input,.toolbar select{background:#1e1e1e;border:1px solid #333;color:#ccc;padding:5px 10px;border-radius:3px;font-size:12px;font-family:inherit}
.toolbar input::placeholder{color:#555}.toolbar input:focus,.toolbar select:focus{outline:none;border-color:#6af}
.toolbar label{color:#888;font-size:12px;display:flex;align-items:center;gap:4px}
.toolbar label input[type=checkbox]{accent-color:#6af}
#graph-wrap{flex:1;position:relative;overflow:hidden}
#graph{width:100%;height:100%}
#graph svg{width:100%;height:100%;display:block}
.node{cursor:pointer;transition:opacity .15s}
.node:hover{opacity:.8}
.search-hit circle{stroke:#ffd54f;stroke-width:2.6;filter:drop-shadow(0 0 7px rgba(255,213,79,.75))}
.search-hit .node-label-bg{stroke:#ffd54f;stroke-opacity:.6}
#minimap{position:absolute;bottom:16px;right:16px;width:160px;height:110px;background:rgba(15,15,15,.92);border:1px solid #333;border-radius:6px;overflow:hidden;z-index:9;display:none}
#minimap canvas{width:100%;height:100%;display:block}
#minimap-vp{position:absolute;border:1px solid #6af;background:rgba(107,175,255,.12);pointer-events:none}
.node-label{font-size:10px;pointer-events:none;fill:#e3e3e3;dominant-baseline:middle}
.node-label-bg{pointer-events:none;fill:#141414;fill-opacity:.88;stroke:#3a3a3a;stroke-width:.5}
.node-type-label{font-size:8px;pointer-events:none;fill:#999;letter-spacing:.4px;dominant-baseline:middle}
.node-label.hidden{display:none}
.node-label-bg.hidden,.node-type-label.hidden{display:none}
.lod-hidden{display:none}
.link{stroke-opacity:.34}
.link:hover{stroke-opacity:.8}
.link-label{font-size:8px;fill:#aaa;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#0d0d0d;stroke-width:3px;stroke-linejoin:round}
.orphan-ring{fill:none;stroke:#ff7043;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:orphanPulse 1.8s ease-out infinite}
@keyframes orphanPulse{0%{transform:scale(.85);opacity:.95}100%{transform:scale(2);opacity:0}}
.edge-throb{animation:throbW 1.3s ease-in-out infinite;filter:drop-shadow(0 0 2px rgba(239,83,80,.55))}
@keyframes throbW{0%,100%{stroke-width:3}50%{stroke-width:5.5}}
.legend{position:absolute;bottom:16px;left:16px;background:rgba(20,20,20,.92);border:1px solid #333;border-radius:6px;padding:12px 16px;font-size:11px;max-height:60vh;overflow-y:auto;z-index:10}
.legend h3{color:#999;font-weight:500;font-size:11px;margin-bottom:6px;letter-spacing:.3px}
.legend-row{display:flex;align-items:center;gap:8px;margin:3px 0;color:#aaa}
.legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend-line{width:16px;height:2px;flex-shrink:0;border-radius:1px}
#detail{position:absolute;top:16px;right:16px;width:340px;max-height:calc(100vh - 200px);background:rgba(20,20,20,.95);border:1px solid #333;border-radius:6px;padding:0;display:none;flex-direction:column;z-index:10;font-size:12px;overflow:hidden}
#detail.show{display:flex}
#detail h2{font-size:13px;color:#e0e0e0;padding:12px 14px;border-bottom:1px solid #2a2a2a;font-weight:500;display:flex;align-items:center;gap:8px}
#detail-close{margin-left:auto;background:none;border:none;color:#666;cursor:pointer;font-size:16px;padding:0 4px}
#detail-close:hover{color:#fff}
#detail-body{padding:12px 14px;overflow-y:auto;flex:1;line-height:1.6}
.detail-row{display:flex;gap:8px;margin:4px 0}
.detail-key{color:#666;min-width:80px;flex-shrink:0}
.detail-val{color:#ccc;word-break:break-word}
.detail-val.content{color:#ddd;max-height:150px;overflow-y:auto;background:#111;padding:6px 8px;border-radius:3px;font-size:11px;line-height:1.4;margin-top:2px}
#graph-controls{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:10}
#graph-controls button{background:rgba(30,30,30,.9);border:1px solid #444;color:#ccc;width:32px;height:28px;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
#graph-controls button:hover{background:#333;border-color:#666}
.empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;text-align:center;font-size:14px;z-index:1;pointer-events:none}
.empty-state span{font-size:40px;display:block;margin-bottom:12px;opacity:.3}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#555}
</style>
</head>
<body>

<header>
  <h1>ASHA <span>Memory Graph</span></h1>
  <div class="file-area">
    <label class="file-label" for="db-file">Open Database</label>
    <input type="file" id="db-file" accept=".db" hidden>
  </div>
</header>

<div id="status">Open a v2 database file to visualize the memory graph.</div>

<div id="stats">
  <div class="stat"><span>Nodes</span><span id="stat-nodes">0</span></div>
  <div class="stat"><span>Edges</span><span id="stat-edges">0</span></div>
  <div class="stat"><span>Edges Shown</span><span id="stat-shown">—</span></div>
  <div class="stat"><span>Node Types</span><span id="stat-types">—</span></div>
  <div class="stat"><span>Edge Types</span><span id="stat-edgetypes">—</span></div>
  <div class="stat"><span>Working</span><span id="stat-layer-working">—</span></div>
  <div class="stat"><span>Short-Term</span><span id="stat-layer-short">—</span></div>
  <div class="stat"><span>Long-Term</span><span id="stat-layer-long">—</span></div>
  <div class="stat"><span>Archive</span><span id="stat-layer-archive">—</span></div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Filter nodes by label or content...">
  <select id="type-filter"><option value="">All types</option></select>
  <label><input type="checkbox" id="chk-labels" checked> Labels</label>
  <label><input type="checkbox" id="chk-edges" checked> Edges</label>
  <label><input type="checkbox" id="chk-edge-labels"> Edge labels</label>
  <label><input type="checkbox" id="chk-orphans"> Orphans</label>
  <label title="Telemetry logs (FEED_SNAPSHOT, RUNTIME_SAMPLE) bloat the graph"><input type="checkbox" id="chk-ephemeral" checked> Hide Ephemeral</label>
  <div id="edge-limit-wrap" style="display:flex;align-items:center;gap:6px;margin-left:8px;padding-left:8px;border-left:1px solid #2a2a2a" title="Cap rendered edges — sorted by weight (strongest first)">
    <label for="edge-limit" style="color:#888;font-size:11px;white-space:nowrap">Edges</label>
    <input type="range" id="edge-limit" min="50" max="3000" step="50" value="1500" style="width:130px;accent-color:#6af;height:4px">
    <span id="edge-limit-val" style="color:#e0e0e0;font-size:11px;min-width:48px;text-align:right">1500</span>
    <select id="edge-sort" style="background:#1e1e1e;border:1px solid #333;color:#ccc;padding:3px 6px;border-radius:3px;font-size:11px">
      <option value="weight">top weight</option>
      <option value="recent">recent first</option>
      <option value="type">by type</option>
    </select>
  </div>
  <button id="btn-layout" style="background:#1e1e1e;border:1px solid #333;color:#ccc;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px;font-family:inherit">Re-layout</button>
</div>

<div class="toolbar" id="toolbar2" style="background:#0f0f0f;border-bottom:1px solid #222;padding:6px 12px;gap:10px">
  <div style="display:flex;align-items:center;gap:6px" title="Hide weak edges">
    <label for="weight-floor" style="color:#888;font-size:11px;white-space:nowrap">Weight ≥ <span id="weight-val" style="color:#e0e0e0">0.00</span></label>
    <input type="range" id="weight-floor" min="0" max="1" step="0.05" value="0" style="width:90px;accent-color:#6af;height:4px">
  </div>
  <div style="display:flex;align-items:center;gap:6px" title="Hide low-degree leaves / isolate hubs">
    <label for="degree-floor" style="color:#888;font-size:11px;white-space:nowrap">Degree ≥ <span id="degree-val" style="color:#e0e0e0">0</span></label>
    <input type="range" id="degree-floor" min="0" max="10" step="1" value="0" style="width:80px;accent-color:#6af;height:4px">
    <label style="color:#888;font-size:11px;display:flex;align-items:center;gap:3px"><input type="checkbox" id="chk-hide-leaves"> Hide leaves (deg 1)</label>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <label for="layer-filter" style="color:#888;font-size:11px">Layer</label>
    <select id="layer-filter" style="background:#1e1e1e;border:1px solid #333;color:#ccc;padding:3px 6px;border-radius:3px;font-size:11px">
      <option value="">All layers</option><option value="working">working</option><option value="short_term">short_term</option><option value="long_term">long_term</option><option value="archive">archive</option>
    </select>
  </div>
  <div style="position:relative">
    <button id="btn-edge-types" style="background:#1e1e1e;border:1px solid #333;color:#ccc;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:11px">Edge types ▾</button>
    <div id="edge-type-popover" style="display:none;position:absolute;top:28px;left:0;background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:8px;z-index:20;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,0.5)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="color:#999;font-size:11px">Show edge types</span><button id="btn-edge-all" style="background:none;border:none;color:#6af;font-size:10px;cursor:pointer">All</button><button id="btn-edge-none" style="background:none;border:none;color:#6af;font-size:10px;cursor:pointer">None</button></div>
      <div id="edge-type-list" style="display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto"></div>
      <div style="margin-top:6px;display:flex;gap:4px"><button id="btn-hide-relates" style="background:#2a2a1a;border:1px solid #333;color:#ea6;padding:2px 6px;border-radius:3px;font-size:10px;cursor:pointer">Hide RELATES_TO flood</button></div>
    </div>
  </div>
  <button id="btn-focus-clear" style="display:none;background:#3a1a1a;border:1px solid #5a2a2a;color:#e88;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:11px">✕ Clear focus</button>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button id="btn-export-png" title="Save visual graph as PNG" style="background:#1a2a3a;border:1px solid #2a5a8a;color:#8bf;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px">⬇ PNG</button>
    <button id="btn-export-json" title="Export filtered subgraph as JSON" style="background:#1e1e1e;border:1px solid #333;color:#ccc;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px">⬇ JSON</button>
    <button id="btn-export-graphml" title="Export filtered subgraph as GraphML" style="background:#1e1e1e;border:1px solid #333;color:#ccc;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px">⬇ GraphML</button>
  </div>
</div>

<div id="graph-wrap">
  <div class="empty-state" id="empty"><span>◈</span>Load a v2 database to explore the memory graph</div>
  <div id="graph"></div>
  <div id="graph-controls">
    <button id="btn-zoom-in" title="Zoom in">+</button>
    <button id="btn-zoom-out" title="Zoom out">−</button>
    <button id="btn-reset" title="Reset view">⟲</button>
    <button id="btn-fit" title="Fit graph to view">⤢</button>
  </div>
  <div id="detail">
    <h2><span id="detail-type-badge"></span><span id="detail-title">Node</span><button id="detail-close">✕</button></h2>
    <div id="detail-body"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div id="minimap" title="Minimap — shows full graph, viewport box tracks zoom"><canvas id="minimap-canvas" width="160" height="110"></canvas><div id="minimap-vp"></div></div>
</div>

<script>
// ── Color maps ──────────────────────────────────────────────────────────────
const NODE_COLORS = {
  PERSON:     "#4caf50",
  FACT:       "#ab47bc",
  PREFERENCE: "#26c6da",
  EVENT:      "#ffa726",
  TOPIC:      "#42a5f5",
  AFFECT:     "#ec407a",
  BOUNDARY:   "#ef5350",
  SKILL:      "#66bb6a",
  AGENT_NOTE: "#d4e157",
  CORE_REF:   "#7e57c2",
};

const EDGE_COLORS = {
  RELATES_TO:     "#888",
  CONTRADICTS:    "#ef5350",
  SUPPORTS:       "#66bb6a",
  CAUSED_BY:      "#ffa726",
  PART_OF:        "#42a5f5",
  TRUSTS:         "#26c6da",
  DISTRUSTS:      "#ef5350",
  REMEMBERS:      "#ab47bc",
  HAS_PREFERENCE: "#26c6da",
  HAS_BOUNDARY:   "#ef5350",
  HAS_AFFECT:     "#ec407a",
  HAS_SKILL:      "#66bb6a",
  REFERS_TO:      "#7e57c2",
  SUMMARIZES:     "#d4e157",
};

function nodeColor(t) { return NODE_COLORS[t] || "#888" }
function edgeColor(t) { return EDGE_COLORS[t] || "#666" }
function nodeRadius(d) { return Math.max(8, Math.min(16, 8 + (d.importance || 0.5) * 8)); }
function labelText(d) { return d.label.length > 30 ? d.label.slice(0, 28) + "…" : d.label; }
function linkNodeId(value) { return typeof value === "object" ? value.id : value; }

// ── Performance knobs ───────────────────────────────────────────────────────
let edgeLimit = 1500;   // slider-controlled render cap (was const MAX_EDGES)
let edgeSortMode = "weight"; // weight | recent | type
let weightFloor = 0, degreeFloor = 0, hideLeaves = false, layerFilter = "";
let hiddenEdgeTypes = new Set();
let focusNodeId = null;
const BIG_GRAPH = 500;    // nodes above which heavy forces/collision are disabled
const LOD_LABEL_SCALE = 0.45; // below this zoom level labels are hidden
let EPHEMERAL_SET = new Set(["FEED_SNAPSHOT","RUNTIME_SAMPLE","TIME_ENTRY","DAILY_STATE","CRON_SUPERVISOR_REPORT","BRAIN_MAINTENANCE_REPORT","BRAIN_HISTORY"]); // bloat logs - overridden by /api/config when embedded

// ── State ────────────────────────────────────────────────────────────────────
let nodes = [], links = [];
let sim, svg, linkG, nodeG, linkLabelG, zoom;
let linkSel, nodeSel, llSel = null; // cached D3 selections (perf: no re-query per tick)
let adjMap = new Map();  // node id -> Set(neighbor ids)  (hover highlight)
let degMap = new Map();  // node id -> degree             (orphan check)
let nodeMap = {}; // id -> node (detail lookup, perf)
let edgeCulled = false;
let lastFilteredLinkCount = 0;
let db = null;
let _resizeHandler = null; // dedup resize listener

// ── SQL.js init ──────────────────────────────────────────────────────────────
let SQL, ready = false;
initSqlJs({
  locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/${file}`
}).then(s => {
  SQL = s; ready = true;
  setStatus("Open a v2 database file to visualize the memory graph.", "");
}).catch(e => {
  setStatus("Failed to load SQL.js: " + e.message + " — check internet connection.", "error");
});

// ── Check D3 loaded ──────────────────────────────────────────────────────────
if (typeof d3 === "undefined") {
  document.getElementById("status").textContent = "Failed to load D3.js — check internet connection.";
  document.getElementById("status").className = "error";
}

// ── File loader ──────────────────────────────────────────────────────────────
document.getElementById("db-file").addEventListener("change", async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!ready) { setStatus("Libraries still loading, try again in a moment.", "loading"); return; }
  if (typeof d3 === "undefined") { setStatus("D3.js not loaded — check internet connection.", "error"); return; }
  setStatus("Loading database...", "loading");
  try {
    const buf = await file.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));
    const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
    if (!tables.length) {
      setStatus("Not a valid ASHA v2 database (no tables found).", "error");
      db = null; return;
    }
    const names = tables[0].values.map(r => r[0]);
    if (!names.includes("nodes")) {
      setStatus("Not a valid ASHA v2 database (missing 'nodes' table). Found: " + names.slice(0,8).join(", "), "error");
      db = null; return;
    }
    const cols = db.exec("PRAGMA table_info(nodes)");
    if (cols.length) {
      const colNames = cols[0].values.map(c => c[1]);
      if (!colNames.includes("node_id") || !colNames.includes("node_type") || !colNames.includes("content")) {
        setStatus("'nodes' table has wrong columns: " + colNames.join(", "), "error");
        db = null; return;
      }
    }
    loadGraph();
  } catch(err) {
    setStatus("Error: " + err.message, "error");
    db = null;
  }
});

// ── Graph loading ────────────────────────────────────────────────────────────
function loadGraph() {
  try {
    setStatus("Building graph...", "loading");

    // Load nodes (layer is in memory_layers table)
    const nodeRows = db.exec("SELECT n.node_id, n.node_type, n.label, n.content, n.trust_level, n.importance, COALESCE(l.layer, 'short_term') FROM nodes n LEFT JOIN memory_layers l ON n.node_id = l.node_id ORDER BY n.node_type");
    nodeMap = {};
    nodes = (nodeRows.length ? nodeRows[0].values : []).map(r => ({
      id: r[0], node_type: r[1] || "UNKNOWN", label: r[2] || r[0].slice(0,16),
      content: r[3] || "", trust: r[4], importance: r[5], layer: r[6] || "short_term",
    }));
    nodes.forEach(n => nodeMap[n.id] = n);

    // Load edges
    const edgeRows = db.exec("SELECT edge_id, from_node, to_node, edge_type, weight FROM edges");
    links = (edgeRows.length ? edgeRows[0].values : []).map(r => ({
      id: r[0], source: r[1], target: r[2], edge_type: r[3] || "RELATES_TO", weight: r[4] || 1.0,
    })).filter(l => nodeMap[l.source] && nodeMap[l.target]);

    // Build adjacency + degree maps once (O(1) hover highlight / orphan checks)
    adjMap = new Map(); degMap = new Map();
    nodes.forEach(n => { adjMap.set(n.id, new Set()); degMap.set(n.id, 0); });
    links.forEach(l => {
      const s = linkNodeId(l.source), t = linkNodeId(l.target);
      adjMap.get(s).add(t); adjMap.get(t).add(s);
      degMap.set(s, (degMap.get(s) || 0) + 1);
      degMap.set(t, (degMap.get(t) || 0) + 1);
    });

    // Update stats
    document.getElementById("stat-nodes").textContent = nodes.length;
    document.getElementById("stat-edges").textContent = links.length;
    document.getElementById("stat-shown").textContent = "—";
    const typeSet = new Set(nodes.map(n => n.node_type));
    document.getElementById("stat-types").textContent = typeSet.size + " categories";
    const etypeSet = new Set(links.map(l => l.edge_type));
    document.getElementById("stat-edgetypes").textContent = etypeSet.size + " relationships";
    const layerCounts = {};
    nodes.forEach(n => { layerCounts[n.layer] = (layerCounts[n.layer] || 0) + 1; });
    document.getElementById("stat-layer-working").textContent = layerCounts["working"] || 0;
    document.getElementById("stat-layer-short").textContent = layerCounts["short_term"] || 0;
    document.getElementById("stat-layer-long").textContent = layerCounts["long_term"] || 0;
    document.getElementById("stat-layer-archive").textContent = layerCounts["archive"] || 0;
    document.getElementById("stats").style.display = "flex";

    // Init edge slider — dynamic max = total edges (up to 5000)
    (function(){
      const slider = document.getElementById("edge-limit");
      const valEl = document.getElementById("edge-limit-val");
      const wrap = document.getElementById("edge-limit-wrap");
      if (!slider || !valEl || !wrap) return;
      const total = links.length;
      const max = Math.max(100, Math.min(5000, total || 1500));
      slider.max = max;
      slider.min = total > 50 ? 50 : 0;
      if (edgeLimit > max) edgeLimit = max;
      slider.value = Math.min(edgeLimit, max);
      valEl.textContent = total <= max && edgeLimit >= total ? total + " (all)" : String(slider.value);
      wrap.style.display = total ? "flex" : "none";
      // update stats shown hint
      const shownEl = document.getElementById("stat-shown");
      if (shownEl) shownEl.title = "Drag slider to cap rendered edges — strongest " + edgeLimit + " shown";
    })();

    // Populate type filter
    const sel = document.getElementById("type-filter");
    sel.innerHTML = '<option value="">All types</option>';
    [...typeSet].sort().forEach(t => {
      const o = document.createElement("option");
      o.value = t; o.textContent = t; sel.appendChild(o);
    });

    // Legend
    buildLegend();

    if (nodes.length === 0) {
      document.getElementById("empty").innerHTML = "<span>◈</span>No nodes found in database";
      document.getElementById("empty").style.display = "block";
      setStatus("Loaded: 0 nodes, 0 edges", "ok");
      return;
    }

    document.getElementById("empty").style.display = "none";
    renderGraph();
    setStatus(`Loaded: ${nodes.length} nodes, ${links.length} edges` +
      (nodes.length > BIG_GRAPH ? ` — large graph: reduced force simulation` : ""), "ok");
  } catch(err) {
    setStatus("Error building graph: " + err.message, "error");
  }
}

// ── Legend ───────────────────────────────────────────────────────────────────
function buildLegend() {
  const el = document.getElementById("legend");
  let html = '<h3>Node Types</h3>';
  const typeOrder = ["PERSON","FACT","PREFERENCE","EVENT","TOPIC","AFFECT","BOUNDARY","SKILL","AGENT_NOTE","CORE_REF"];
  const used = new Set(nodes.map(n => n.node_type));
  typeOrder.filter(t => used.has(t)).forEach(t => {
    html += `<div class="legend-row"><span class="legend-swatch" style="background:${nodeColor(t)}"></span>${t}</div>`;
  });
  if (links.length) {
    html += '<h3 style="margin-top:10px">Edge Types</h3>';
    const eused = new Set(links.map(l => l.edge_type));
    const edgeOrder = ["RELATES_TO","CONTRADICTS","SUPPORTS","CAUSED_BY","PART_OF","TRUSTS","DISTRUSTS","REMEMBERS","HAS_PREFERENCE","HAS_BOUNDARY","HAS_AFFECT","HAS_SKILL","REFERS_TO","SUMMARIZES"];
    edgeOrder.filter(t => eused.has(t)).forEach(t => {
      html += `<div class="legend-row"><span class="legend-line" style="background:${edgeColor(t)}"></span>${t}</div>`;
    });
  }
  el.innerHTML = html;
}

// ── D3 Graph Rendering ──────────────────────────────────────────────────────
function renderGraph() {
  // Clean up previous simulation if any
  if (sim) { sim.stop(); sim = null; }
  linkG = null; nodeG = null; linkLabelG = null;
  linkSel = null; nodeSel = null; llSel = null;

  const wrap = document.getElementById("graph-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const el = document.getElementById("graph");
  el.innerHTML = "";

  const svgW = w > 100 ? w : 800, svgH = h > 100 ? h : 600;
  svg = d3.select("#graph").append("svg")
    .attr("width", svgW).attr("height", svgH)
    .style("cursor", "grab");

  // Filter state
  let searchStr = "", typeFilter = "", showOrphans = true, showEdgeLabels = false;
  const chkLabels = document.getElementById("chk-labels");
  const chkEdges = document.getElementById("chk-edges");
  const chkOrphans = document.getElementById("chk-orphans");
  const chkEdgeLabels = document.getElementById("chk-edge-labels");
  const chkEphemeral = document.getElementById("chk-ephemeral");

  const big = nodes.length > BIG_GRAPH;

  function filteredNodes() {
    const hideEphemeral = chkEphemeral && chkEphemeral.checked;
    return nodes.filter(n => {
      if (hideEphemeral && EPHEMERAL_SET.has(n.label)) return false;
      if (layerFilter && n.layer !== layerFilter) return false;
      if (degreeFloor > 0 && (degMap.get(n.id)||0) < degreeFloor) return false;
      if (hideLeaves && (degMap.get(n.id)||0) === 1) return false;
      if (focusNodeId) {
        if (n.id !== focusNodeId && !(adjMap.get(focusNodeId)||new Set()).has(n.id)) return false;
      }
      if (typeFilter && n.node_type !== typeFilter) return false;
      if (searchStr) {
        const q = searchStr.toLowerCase();
        if (!n.label.toLowerCase().includes(q) && !(n.content || "").toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }

  function filteredLinks() {
    const fn = new Set(filteredNodes().map(n => n.id));
    return links.filter(l => fn.has(linkNodeId(l.source)) && fn.has(linkNodeId(l.target)));
  }

  function isOrphan(id) {
    return !(degMap.get(id) || 0);
  }

  function visibleNodes() {
    let vn = filteredNodes();
    if (!showOrphans) vn = vn.filter(n => !isOrphan(n.id));
    return vn;
  }

  function visibleLinks() {
    if (!chkEdges.checked) return [];
    let fl = filteredLinks();
    // weight + type filters (before cap)
    if (weightFloor > 0) fl = fl.filter(l => (l.weight||0) >= weightFloor);
    if (hiddenEdgeTypes.size) fl = fl.filter(l => !hiddenEdgeTypes.has(l.edge_type));
    lastFilteredLinkCount = fl.length;
    edgeCulled = false;
    // Slider-controlled cap — was hard 1500
    if (fl.length > edgeLimit) {
      if (edgeSortMode === "weight") fl = fl.slice().sort((a, b) => (b.weight || 0) - (a.weight || 0)).slice(0, edgeLimit);
      else if (edgeSortMode === "recent") {
        // edges table has no recent field in JS copy; fall back to id order (insertion = recency not accurate) — keep weight as proxy if no timestamp
        fl = fl.slice().sort((a, b) => (b.weight || 0) - (a.weight || 0)).slice(0, edgeLimit);
      } else if (edgeSortMode === "type") fl = fl.slice().sort((a, b) => a.edge_type.localeCompare(b.edge_type)).slice(0, edgeLimit);
      else fl = fl.slice(0, edgeLimit);
      edgeCulled = true;
    }
    return fl;
  }

  // Zoom + LOD (hide labels when zoomed out — huge win on dense graphs)
  zoom = d3.zoom().scaleExtent([0.08, 8]).on("zoom", (event) => {
    container.attr("transform", event.transform);
    updateLOD(event.transform.k);
    // minimap viewport tracks zoom
    if (Math.random()<0.15) drawMinimap();
  });
  svg.call(zoom);

  const container = svg.append("g");

  // Arrow markers
  const defs = svg.append("defs");
  defs.append("marker")
    .attr("id", "arrow").attr("viewBox", "0 -5 10 10").attr("refX", 22).attr("refY", 0)
    .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
    .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#666");

  // Link defs per type
  const etypes = [...new Set(links.map(l => l.edge_type))];
  etypes.forEach(et => {
    const c = edgeColor(et);
    defs.append("marker")
      .attr("id", "arrow-" + et.replace(/_/g,"")).attr("viewBox", "0 -5 10 10").attr("refX", 22).attr("refY", 0)
      .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
      .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", c);
  });

  // Glow filter
  const glow = defs.append("filter").attr("id", "glow").attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
  glow.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "blur");
  glow.append("feMerge").append("feMergeNode").attr("in", "blur").append("feMergeNode").attr("in", "SourceGraphic");

  // Simulation — adaptive: large graphs get cheaper forces and settle faster
  const typeOrder = [...new Set(nodes.map(n => n.node_type))].sort();
  const typeAnchors = new Map(typeOrder.map((type, index) => {
    const angle = (index / Math.max(typeOrder.length, 1)) * Math.PI * 2 - Math.PI / 2;
    const radius = Math.min(svgW, svgH) * 0.24;
    return [type, { x: svgW / 2 + Math.cos(angle) * radius, y: svgH / 2 + Math.sin(angle) * radius }];
  }));

  sim = d3.forceSimulation()
    .force("link", d3.forceLink().id(d => d.id)
      .distance(d => (big ? 70 : 110) - Math.min(d.weight || 1, 1) * 24)
      .strength(big ? 0.35 : 0.62))
    .force("charge", d3.forceManyBody().strength(big ? -260 : -420))
    .force("center", d3.forceCenter(svgW/2, svgH/2))
    .alphaDecay(big ? 0.06 : 0.03);
  if (!big) {
    sim.force("collision", d3.forceCollide(d => nodeRadius(d) + Math.min(110, labelText(d).length * 3.3 + 30)));
  }
  sim.force("x", d3.forceX(d => typeAnchors.get(d.node_type).x).strength(big ? 0.035 : 0.055))
     .force("y", d3.forceY(d => typeAnchors.get(d.node_type).y).strength(big ? 0.035 : 0.055));

  // LOD: hide labels below a zoom threshold (applied on zoom + restart)
  function updateLOD(k) {
    const show = k >= LOD_LABEL_SCALE;
    if (nodeSel) {
      nodeSel.selectAll(".node-label,.node-type-label,.node-label-bg").classed("lod-hidden", !show);
    }
    if (llSel) llSel.classed("lod-hidden", !(show && showEdgeLabels));
  }

  // Cached-selection tick (the #1 perf win: no selectAll per tick)
  function tick() {
    linkSel
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    llSel
      .attr("x", d => (d.source.x + d.target.x)/2)
      .attr("y", d => (d.source.y + d.target.y)/2);
    nodeSel
      .attr("transform", d => `translate(${d.x},${d.y})`);
    if (nodes.length <= 700 && Math.random()<0.07) drawMinimap();
  }

  function fitView() {
    if (!nodeSel || !nodeSel.size()) return;
    const tx = d3.zoomTransform(svg.node());
    const ns = nodeSel.nodes();
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < ns.length; i++) {
      const d = ns[i].__data__;
      if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x;
      if (d.y < y0) y0 = d.y; if (d.y > y1) y1 = d.y;
    }
    const bw = Math.max(x1 - x0, 1), bh = Math.max(y1 - y0, 1);
    const k = Math.min((svgW - 80) / bw, (svgH - 80) / bh, 2);
    svg.transition().duration(500)
      .call(zoom.transform, d3.zoomIdentity.translate(svgW/2 - k*(x0+x1)/2, svgH/2 - k*(y0+y1)/2).scale(k));
  }

  function exportPNG(){
    try {
      const svgEl = document.querySelector("#graph svg");
      if (!svgEl) return;
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
      const css = document.querySelector("style").outerHTML;
      const xml = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([xml], {type:"image/svg+xml;charset=utf-8"});
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement("canvas");
        const w = svgEl.clientWidth || 1200, h = svgEl.clientHeight || 800;
        const scale = 2;
        canvas.width = w*scale; canvas.height = h*scale;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#0d0d0d"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(url);
        const a = document.createElement("a");
        a.download = "asha_graph_" + new Date().toISOString().slice(0,10) + ".png";
        a.href = canvas.toDataURL("image/png");
        a.click();
        setStatus("PNG exported ("+w+"×"+h+" @2x)","ok");
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); setStatus("PNG export failed","error"); };
      img.src = url;
    } catch(e){ setStatus("PNG export failed: "+e.message,"error"); }
  }
  function exportFilteredJSON(){
    try {
      const vn = visibleNodes(), vl = visibleLinks();
      const data = { exported_at: new Date().toISOString(), visible_nodes: vn.length, visible_edges: vl.length, total_nodes: nodes.length, total_edges: links.length, nodes: vn, edges: vl.map(l=>({edge_id:l.id, from_node:linkNodeId(l.source), to_node:linkNodeId(l.target), edge_type:l.edge_type, weight:l.weight})) };
      const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "asha_graph_filtered_" + vn.length + "n_" + vl.length + "e.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      setStatus("Exported JSON: "+vn.length+" nodes, "+vl.length+" edges","ok");
    } catch(e){ setStatus("JSON export failed: "+e.message,"error"); }
  }
  function exportFilteredGraphML(){
    try {
      const vn = visibleNodes(), vl = visibleLinks();
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<graphml xmlns="http://graphml.graphdrawing.org/xmlns">\n<key id="k_label" for="node" attr.name="label" attr.type="string"/>\n<key id="k_type" for="node" attr.name="node_type" attr.type="string"/>\n<key id="k_weight" for="edge" attr.name="weight" attr.type="double"/>\n<key id="k_etype" for="edge" attr.name="edge_type" attr.type="string"/>\n<graph edgedefault="directed">\n';
      vn.forEach(n=>{ xml += `  <node id="${n.id}"><data key="k_label">${n.label.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</data><data key="k_type">${n.node_type}</data></node>\n`; });
      vl.forEach(l=>{ xml += `  <edge id="${l.id}" source="${linkNodeId(l.source)}" target="${linkNodeId(l.target)}"><data key="k_weight">${l.weight}</data><data key="k_etype">${l.edge_type}</data></edge>\n`; });
      xml += '</graph>\n</graphml>';
      const blob = new Blob([xml], {type:"application/xml"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "asha_graph_filtered_" + vn.length + "n.graphml"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      setStatus("Exported GraphML: "+vn.length+" nodes","ok");
    } catch(e){ setStatus("GraphML export failed: "+e.message,"error"); }
  }
  function drawMinimap(){
    const mm = document.getElementById("minimap");
    const canvas = document.getElementById("minimap-canvas");
    if (!mm || !canvas || !nodes.length) return;
    if (nodes.length > 1000) { mm.style.display="none"; return; }
    mm.style.display = "block";
    const ctx = canvas.getContext("2d");
    const W=canvas.width, H=canvas.height;
    ctx.clearRect(0,0,W,H);
    // bounds
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    nodes.forEach(n=>{ if (n.x!=null){ if(n.x<x0)x0=n.x; if(n.x>x1)x1=n.x; if(n.y<y0)y0=n.y; if(n.y>y1)y1=n.y; }});
    if (!isFinite(x0)) return;
    const pad=20, bw=Math.max(x1-x0,1), bh=Math.max(y1-y0,1);
    const scale = Math.min((W-pad*2)/bw, (H-pad*2)/bh);
    const ox = (W - bw*scale)/2 - x0*scale, oy = (H - bh*scale)/2 - y0*scale;
    // edges
    ctx.strokeStyle="#333"; ctx.lineWidth=0.5;
    const vl = visibleLinks();
    vl.forEach(l=>{
      const s = typeof l.source==="object" ? l.source : nodeMap[linkNodeId(l.source)];
      const t = typeof l.target==="object" ? l.target : nodeMap[linkNodeId(l.target)];
      if (!s||!t||s.x==null) return;
      ctx.beginPath(); ctx.moveTo(s.x*scale+ox, s.y*scale+oy); ctx.lineTo(t.x*scale+ox, t.y*scale+oy); ctx.stroke();
    });
    // nodes
    nodes.forEach(n=>{
      if (n.x==null) return;
      const isVis = visibleNodes().some(v=>v.id===n.id);
      ctx.fillStyle = isVis ? nodeColor(n.node_type) : "#444";
      ctx.globalAlpha = isVis ? 1 : 0.25;
      ctx.beginPath(); ctx.arc(n.x*scale+ox, n.y*scale+oy, isVis?1.8:1.2, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    // viewport box
    try {
      const tr = d3.zoomTransform(svg.node());
      const vp = document.getElementById("minimap-vp");
      if (vp) {
        const svgW = svg.node().clientWidth || 800, svgH = svg.node().clientHeight || 600;
        const vx = (-tr.x/tr.k)*scale+ox, vy = (-tr.y/tr.k)*scale+oy, vw = (svgW/tr.k)*scale, vh = (svgH/tr.k)*scale;
        vp.style.left = vx+"px"; vp.style.top = vy+"px"; vp.style.width = vw+"px"; vp.style.height = vh+"px";
        vp.style.display = "block";
      }
    } catch(e){}
  }

  function restart(keepAlpha) {
    const vn = visibleNodes(), vl = visibleLinks();

    // Join links
    if (!linkG) linkG = container.append("g").attr("class", "links");
    const ls = linkG.selectAll("line").data(vl, d => d.id);
    ls.exit().remove();
    ls.enter().append("line")
      .attr("stroke", d => edgeColor(d.edge_type))
      .attr("class", d => d.edge_type === "CONTRADICTS" ? "edge-throb" : null)
      .attr("stroke-width", d => d.edge_type === "CONTRADICTS" ? Math.max(3, d.weight * 3 + 1) : Math.max(1, d.weight * 3))
      .attr("marker-end", d => "url(#arrow-" + d.edge_type.replace(/_/g,"") + ")")
      .on("mouseenter", function() { d3.select(this).attr("stroke-opacity", 0.9); })
      .on("mouseleave", function() { d3.select(this).attr("stroke-opacity", 0.4); });
    linkSel = linkG.selectAll("line");
    linkSel.attr("stroke-opacity", 0.4);

    // Edge labels (only when enabled)
    if (!linkLabelG) linkLabelG = container.append("g").attr("class", "link-labels");
    const ll = linkLabelG.selectAll("text").data(showEdgeLabels ? vl : [], d => d.id);
    ll.exit().remove();
    const llEnter = ll.enter().append("text")
      .attr("class", "link-label")
      .text(d => d.edge_type);
    llSel = ll.merge(llEnter);
    llSel.text(d => d.edge_type);

    // Join nodes
    if (!nodeG) nodeG = container.append("g").attr("class", "nodes");
    const ns = nodeG.selectAll("g").data(vn, d => d.id);
    ns.exit().remove();
    const ne = ns.enter().append("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
      )
      .on("click", (event, d) => {
        event.stopPropagation();
        showDetail(d);
      })
      .on("dblclick", (event, d) => {
        event.stopPropagation();
        if (focusNodeId === d.id) focusNodeId = null;
        else focusNodeId = d.id;
        document.getElementById("btn-focus-clear").style.display = focusNodeId ? "inline-block" : "none";
        document.getElementById("btn-focus-clear").textContent = focusNodeId ? "✕ Focus: " + d.label.slice(0,16) : "✕ Clear focus";
        restart(0.5);
        setStatus(focusNodeId ? "Focus: " + d.label + " + neighbors (" + ((adjMap.get(d.id)||new Set()).size+1) + " nodes)" : "Focus cleared", focusNodeId ? "loading" : "ok");
      })
      .on("mouseenter", function(event, d) {
        // O(degree) highlight via adjacency map (was O(edges))
        const nb = adjMap.get(d.id) || new Set();
        nodeSel.style("opacity", n => (n.id === d.id || nb.has(n.id)) ? 1 : 0.12);
        linkSel.style("opacity", l =>
          (linkNodeId(l.source) === d.id || linkNodeId(l.target) === d.id) ? 0.9 : 0.04
        );
      })
      .on("mouseleave", function() {
        nodeSel.style("opacity", 1);
        linkSel.style("opacity", 0.4);
      });

    ne.append("circle")
      .attr("r", d => nodeRadius(d))
      .attr("fill", d => nodeColor(d.node_type))
      .attr("stroke", d => d3.color(nodeColor(d.node_type)).darker(0.5))
      .attr("stroke-width", 1.5);

    // Pulse high-importance nodes (skipped on large graphs)
    if (!big) {
      ne.filter(d => (d.importance || 0) >= 0.8).append("circle")
        .attr("r", d => nodeRadius(d) + 5)
        .attr("fill", "none")
        .attr("stroke", d => nodeColor(d.node_type))
        .attr("stroke-width", 1)
        .attr("stroke-opacity", 0.3);
    }

    // Orphan pulse ring — always on so orphans are impossible to miss
    ne.filter(d => isOrphan(d.id)).append("circle")
      .attr("class", "orphan-ring")
      .attr("r", d => nodeRadius(d) + 3);

    ne.append("rect")
      .attr("class", "node-label-bg")
      .attr("x", d => nodeRadius(d) + 6)
      .attr("y", -12)
      .attr("width", d => Math.max(42, labelText(d).length * 6.15 + 12))
      .attr("height", 24)
      .attr("rx", 3);

    ne.append("text")
      .attr("class", "node-type-label")
      .attr("x", d => nodeRadius(d) + 12)
      .attr("y", -5)
      .text(d => d.node_type);

    ne.append("text")
      .attr("class", "node-label")
      .attr("x", d => nodeRadius(d) + 12)
      .attr("y", 5)
      .text(d => labelText(d));

    nodeSel = nodeG.selectAll("g");
    // Search highlight — pulse matching nodes
    if (searchStr) {
      const q = searchStr.toLowerCase();
      nodeSel.classed("search-hit", d => d.label.toLowerCase().includes(q) || (d.content||"").toLowerCase().includes(q));
    } else nodeSel.classed("search-hit", false);

    // Update positions
    sim.nodes(vn);
    sim.force("link").links(vl);
    sim.on("tick", tick);
    if (keepAlpha) sim.alpha(keepAlpha).restart(); else sim.restart();
    updateLOD(d3.zoomTransform(svg.node()).k);
    setTimeout(drawMinimap, 80);

    // Edges-shown stat (culling feedback) — slider makes total vs filtered visible
    (function(){
      const shownEl = document.getElementById("stat-shown");
      if (!shownEl) return;
      if (!edgeCulled) shownEl.textContent = String(vl.length);
      else if (lastFilteredLinkCount !== links.length) shownEl.textContent = vl.length + " / " + lastFilteredLinkCount + " (total " + links.length + ")";
      else shownEl.textContent = vl.length + " / " + links.length;
      shownEl.title = edgeCulled ? "Capped by slider (" + edgeLimit + ", " + edgeSortMode + ") — drag slider to see more" : "All filtered edges shown";
    })();
  }

  let fitted = false;
  sim.on("end", () => { if (!fitted && nodeSel && nodeSel.size()) { fitted = true; fitView(); } });
  restart(1);

  // ── Search / Filter (debounced — restart is expensive) ───────────────────
  let searchTimer = null;
  document.getElementById("search").addEventListener("input", function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchStr = this.value; restart(0.3); }, 250);
  });
  document.getElementById("type-filter").addEventListener("change", function() {
    typeFilter = this.value; restart(0.3);
  });
  chkOrphans.addEventListener("change", function() {
    showOrphans = this.checked; restart(0.3);
  });
  if (chkEphemeral) chkEphemeral.addEventListener("change", function() { restart(0.3); });
  chkLabels.addEventListener("change", function() {
    nodeSel.selectAll(".node-label,.node-type-label,.node-label-bg").classed("hidden", !this.checked);
  });
  chkEdges.addEventListener("change", function() { restart(0.3); });
  chkEdgeLabels.addEventListener("change", function() {
    showEdgeLabels = this.checked; restart(0.3);
  });
  // Edge limit slider + sort (outside LOD, needs restart)
  (function(){
    const slider = document.getElementById("edge-limit");
    const sliderVal = document.getElementById("edge-limit-val");
    const sortSel = document.getElementById("edge-sort");
    if (slider && !slider.dataset.bound) {
      slider.dataset.bound = "1";
      slider.addEventListener("input", function(){
        edgeLimit = parseInt(this.value, 10);
        if (sliderVal) sliderVal.textContent = links.length && edgeLimit >= links.length ? links.length + " (all)" : String(edgeLimit);
        restart(0.3);
      });
    }
    if (sortSel && !sortSel.dataset.bound) {
      sortSel.dataset.bound = "1";
      sortSel.addEventListener("change", function(){ edgeSortMode = this.value; restart(0.3); });
    }
  })();
  // Weight / degree / layer / leaves
  (function(){
    const wf = document.getElementById("weight-floor");
    const wv = document.getElementById("weight-val");
    if (wf && !wf.dataset.bound) {
      wf.dataset.bound="1";
      wf.addEventListener("input", function(){
        weightFloor = parseFloat(this.value);
        if (wv) wv.textContent = weightFloor.toFixed(2);
        restart(0.3);
      });
    }
    const df = document.getElementById("degree-floor");
    const dv = document.getElementById("degree-val");
    if (df && !df.dataset.bound) {
      df.dataset.bound="1";
      df.addEventListener("input", function(){
        degreeFloor = parseInt(this.value,10);
        if (dv) dv.textContent = String(degreeFloor);
        restart(0.3);
      });
    }
    const hl = document.getElementById("chk-hide-leaves");
    if (hl && !hl.dataset.bound) { hl.dataset.bound="1"; hl.addEventListener("change", function(){ hideLeaves=this.checked; restart(0.3); }); }
    const lf = document.getElementById("layer-filter");
    if (lf && !lf.dataset.bound) { lf.dataset.bound="1"; lf.addEventListener("change", function(){ layerFilter=this.value; restart(0.3); }); }
  })();
  // Edge type popover
  (function(){
    const btn = document.getElementById("btn-edge-types");
    const pop = document.getElementById("edge-type-popover");
    const list = document.getElementById("edge-type-list");
    if (!btn || !pop || !list) return;
    // build checklist once
    const types = [...new Set(links.map(l=>l.edge_type))].sort();
    list.innerHTML = types.map(t=>`<label style="display:flex;align-items:center;gap:6px;font-size:11px;color:#ccc"><input type="checkbox" value="${t}" checked style="accent-color:#6af"> <span style="width:10px;height:10px;border-radius:2px;background:${edgeColor(t)};display:inline-block"></span> ${t}</label>`).join("");
    list.querySelectorAll("input").forEach(cb=>{
      cb.addEventListener("change", function(){
        if (this.checked) hiddenEdgeTypes.delete(this.value); else hiddenEdgeTypes.add(this.value);
        restart(0.3);
      });
    });
    btn.onclick = (e)=>{ e.stopPropagation(); pop.style.display = pop.style.display==="none"||!pop.style.display ? "block":"none"; };
    document.addEventListener("click", (e)=>{ if (!pop.contains(e.target) && e.target!==btn) pop.style.display="none"; });
    document.getElementById("btn-edge-all").onclick = ()=>{ hiddenEdgeTypes.clear(); list.querySelectorAll("input").forEach(cb=>cb.checked=true); restart(0.3); };
    document.getElementById("btn-edge-none").onclick = ()=>{ types.forEach(t=>hiddenEdgeTypes.add(t)); list.querySelectorAll("input").forEach(cb=>cb.checked=false); restart(0.3); };
    document.getElementById("btn-hide-relates").onclick = ()=>{
      const cb = list.querySelector('input[value="RELATES_TO"]');
      if (cb) { cb.checked=false; hiddenEdgeTypes.add("RELATES_TO"); restart(0.3); }
    };
  })();
  // Focus clear + exports (ok to re-assign onclick each restart — no duplicate listeners)
  (function(){
    const fc = document.getElementById("btn-focus-clear");
    if (fc) fc.onclick = function(){ focusNodeId=null; fc.style.display="none"; restart(0.3); setStatus("Focus cleared","ok"); };
    const png = document.getElementById("btn-export-png");
    if (png) png.onclick = exportPNG;
    const jsn = document.getElementById("btn-export-json");
    if (jsn) jsn.onclick = exportFilteredJSON;
    const gml = document.getElementById("btn-export-graphml");
    if (gml) gml.onclick = exportFilteredGraphML;
  })();

  // ── Zoom controls ────────────────────────────────────────────────────────
  document.getElementById("btn-zoom-in").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  document.getElementById("btn-zoom-out").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  document.getElementById("btn-reset").onclick = () => {
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  };
  document.getElementById("btn-fit").onclick = () => fitView();
  document.getElementById("btn-layout").onclick = () => restart(1);

  // Click background to deselect
  svg.on("click", () => { document.getElementById("detail").classList.remove("show"); });

  // Resize — single handler (was leaking per re-render)
  if (_resizeHandler) window.removeEventListener("resize", _resizeHandler);
  _resizeHandler = () => {
    if (!sim || !svg) return;
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    svg.attr("width", w2).attr("height", h2);
    sim.force("center", d3.forceCenter(w2/2, h2/2));
    sim.alpha(0.3).restart();
  };
  window.addEventListener("resize", _resizeHandler);
}

// ── Detail Panel ─────────────────────────────────────────────────────────────
function showDetail(d) {
  if (typeof d === "string") d = nodeMap[d];
  if (!d || !d.id) return;
  const el = document.getElementById("detail");
  document.getElementById("detail-title").textContent = d.label;
  const badge = document.getElementById("detail-type-badge");
  badge.textContent = d.node_type;
  badge.style.cssText = `display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:500;background:${d3.color(nodeColor(d.node_type)).darker(1)};color:${nodeColor(d.node_type)}`;

  const body = document.getElementById("detail-body");
  body.innerHTML = "";

  addRow(body, "Node ID", d.id);
  addRow(body, "Type", d.node_type);
  addRow(body, "Label", d.label);
  addContent(body, "Content", d.content);
  addRow(body, "Trust", d.trust != null ? d.trust.toFixed(2) : "—");
  addRow(body, "Importance", d.importance != null ? d.importance.toFixed(2) : "—");
  addRow(body, "Layer", d.layer);
  addRow(body, "Degree", (degMap.get(d.id) || 0) + " connections");

  // Connected nodes — resolve via nodeMap (links may hold string ids or D3 objects)
  const connected = links.filter(l => linkNodeId(l.source) === d.id || linkNodeId(l.target) === d.id);
  if (connected.length) {
    body.innerHTML += '<div class="detail-row" style="margin-top:10px;border-top:1px solid #2a2a2a;padding-top:8px"><span class="detail-key" style="color:#666;font-size:11px">Connections (' + connected.length + ')</span></div>';
    connected.forEach(l => {
      const otherId = linkNodeId(l.source) === d.id ? linkNodeId(l.target) : linkNodeId(l.source);
      const otherNode = nodeMap[otherId];
      const label = otherNode ? otherNode.label : otherId.slice(0,12);
      const c = document.createElement("div");
      c.className = "detail-row";
      c.style.cssText = "cursor:pointer;margin:2px 0;padding:3px 6px;border-radius:3px";
      c.innerHTML = `<span style="color:${edgeColor(l.edge_type)};font-size:10px;min-width:70px">${l.edge_type}</span><span style="color:#aaa;font-size:11px">${escHtml(label)}</span>`;
      c.onmouseenter = () => c.style.background = "#1a1a1a";
      c.onmouseleave = () => c.style.background = "transparent";
      c.onclick = () => showDetail(otherId);
      body.appendChild(c);
    });
  }

  el.classList.add("show");
}

function addRow(parent, key, val) {
  const d = document.createElement("div"); d.className = "detail-row";
  d.innerHTML = `<span class="detail-key">${key}</span><span class="detail-val">${escHtml(String(val))}</span>`;
  parent.appendChild(d);
}
function addContent(parent, key, val) {
  if (!val) return;
  const d = document.createElement("div"); d.className = "detail-row";
  d.style.cssText = "flex-direction:column;gap:2px";
  d.innerHTML = `<span class="detail-key" style="margin-bottom:2px">${key}</span><div class="detail-val content">${escHtml(val)}</div>`;
  parent.appendChild(d);
}
function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

document.getElementById("detail-close").onclick = () => document.getElementById("detail").classList.remove("show");

// ── Utility ──────────────────────────────────────────────────────────────────
function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = type || "";
}

// ── Embedded dashboard support ──────────────────────────────────────────
(function(){
  function loadFromBytes(buf){
    try{
      if(typeof SQL==='undefined' || !ready){ setTimeout(()=>loadFromBytes(buf), 400); return; }
      const u8 = new Uint8Array(buf);
      db = new SQL.Database(u8);
      // validate
      try{
        const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
        if(!tables.length) throw new Error("No tables");
      }catch(e){ setStatus("Embedded load failed: "+e.message, "error"); return; }
      loadGraph();
    }catch(e){ setStatus("Embedded load failed: "+e.message, "error"); }
  }
  window.addEventListener("message", function(ev){
    if(ev.data && ev.data.type==='asha-load-db' && ev.data.buffer){
      let buf=ev.data.buffer;
      if(buf instanceof Uint8Array) buf=buf.buffer;
      loadFromBytes(buf);
    } else if(ev.data && ev.data.type==='asha-config-update' && ev.data.ephemeral_labels){
      EPHEMERAL_SET = new Set(ev.data.ephemeral_labels);
      try{ if(typeof renderGraph==="function" && nodes && nodes.length) { /* will apply on next restart */ } }catch(e){}
    }
  });
  try{
    const params=new URLSearchParams(location.search);
    if(params.has('embedded')){
      fetch('/api/config').then(r=>r.json()).then(j=>{ if(j && j.config && j.config.ephemeral_labels) EPHEMERAL_SET = new Set(j.config.ephemeral_labels); }).catch(()=>{});
      fetch('/api/db_bytes').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); }).then(buf=>{ if(buf.byteLength>0) loadFromBytes(buf); }).catch(()=>{});
    }
  }catch(e){}
  try{ fetch('/api/config').then(r=>r.json()).then(j=>{ if(j && j.config && j.config.ephemeral_labels) EPHEMERAL_SET = new Set(j.config.ephemeral_labels); }).catch(()=>{}); }catch(e){}
})();
</script>
